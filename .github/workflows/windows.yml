name: Windows build and draft release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build, test and package
        shell: pwsh
        run: |
          $tag = ''
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $tag = $env:GITHUB_REF_NAME }
          ./tools/package.ps1 -ExpectedTag $tag
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64-portable
          path: |
            releases/*.zip
            releases/*.sha256
            releases/release-notes.md
          if-no-files-found: error
          retention-days: 14

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-x64-portable
          path: releases
      - name: Create release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" releases/*.zip releases/*.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Peripheral Battery $GITHUB_REF_NAME" \
            --notes-file releases/release-notes.md
